# The robotics plugin's manifest (docs/PLUGINS.md §The manifest).
[plugin]
id = "robotics"
version = "0.1.0"
api = "^0.8"
tier = 0
title = "Robotics"
licence = "MIT OR Apache-2.0"

[capabilities]
document-read = true

[contributes]
exporters = ["robotics.urdf"]

# C3 M2's accept document, `tests/docs/arm`, copied in so the project needs
# nothing outside it (docs/PLUGINS.md §The test kit); run twice to
# identical files.
[[test.exports]]
document = "fixtures/arm"
exporter = "robotics.urdf"
assembly = "Servo on bracket"
