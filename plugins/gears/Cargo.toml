[package]
name = "arrix-gears"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# `rlib` is Tier 0 (compiled in); `cdylib` is the Tier 1 component's core
# module, built for wasm32-unknown-unknown with `--features guest`
# (docs/PLUGINS.md §Three tiers).
[lib]
crate-type = ["rlib", "cdylib"]

[features]
guest = ["arrix-plugin-api/guest"]

[dependencies]
arrix-plugin-api.workspace = true
