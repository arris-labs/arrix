[package]
name = "arrix-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arrix-core.workspace = true
arris.workspace = true
blake3.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
web-time.workspace = true

# The browser probe (plans/c4 step 3): `examples/web_probe`, a page whose
# worker runs an Arris call under a poll over a `SharedArrayBuffer`, run
# in headless Chromium by `tests/web_probe.rs`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
arrix-web-test.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true

[[example]]
name = "web_probe"
path = "examples/web_probe/probe.rs"
crate-type = ["cdylib"]
