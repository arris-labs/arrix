[package]
name = "arrix-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arrix-core.workspace = true
arrix-plugin-api.workspace = true
arrix-doc = { workspace = true, features = ["schema"] }
arrix-plugin-host.workspace = true
arrix-kernel.workspace = true
arrix-gears.workspace = true
arrix-config.workspace = true
base64.workspace = true
clap.workspace = true
serde.workspace = true
# The forward-kinematics property test (tests/c2_m2_fk.rs).
proptest.workspace = true
serde_json.workspace = true
web-time.workspace = true

[dev-dependencies]
# The wire spike (tests/wire_spike.rs, ADR-0022).
ciborium.workspace = true
serde.workspace = true
# The forward-kinematics property test (tests/c2_m2_fk.rs).
proptest.workspace = true
# The serve tests check the wire against its schemas (tests/serve.rs).
jsonschema.workspace = true
# The scenario tests draw sketches (tests/slice.rs, tests/gears.rs).
arrix-sketch.workspace = true

[[bin]]
name = "arrix"
path = "src/main.rs"

# The wire spike (ADR-0022): measured on demand, compared against nothing.
[[test]]
name = "wire_spike"
path = "tests/wire_spike.rs"
test = false
