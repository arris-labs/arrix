# The Tier 1 probe's guest (plans/c3-m1 step 2): a workspace of its own,
# built for wasm32 by `tests/probe_tier1.rs` into its own target directory.
# `sdk` is the shape of `arrix-plugin-api`'s `guest` feature, `gears` the
# plugin's export line.
[workspace]
resolver = "3"
members = ["sdk", "gears"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
