[package]
name = "arrix-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arrix-core.workspace = true
arrix-doc.workspace = true
arrix-plugin-api.workspace = true
base64.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

# Tier 1 (ADR-0035): components compiled and run natively, a core module
# made a component at load.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmparser.workspace = true
wasmtime.workspace = true
wit-component.workspace = true

[dev-dependencies]
arrix-gears.workspace = true
arrix-robotics.workspace = true
regex.workspace = true
wasm-encoder.workspace = true
wasmparser.workspace = true
web-time.workspace = true
wit-component.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wasmtime.workspace = true
arrix-web-test.workspace = true

# The determinism probe runs on wasm32 under Node (tests/wasm_determinism.rs);
# the web session's page (`examples/web_session`) in headless Chromium,
# served by `tests/web_session.rs` through the browser harness.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-test.workspace = true
js-sys.workspace = true

[[example]]
name = "web_session"
path = "examples/web_session/page.rs"
crate-type = ["cdylib"]
