[package]
name = "arrix-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The session protocol's JSON Schemas (ADR-0023 §5): `JsonSchema` on
# the types it carries.
schema = ["dep:schemars", "arrix-core/schema", "arrix-sketch/schema", "arrix-plugin-api/schema"]

[dependencies]
schemars = { workspace = true, optional = true }
arrix-core.workspace = true
arrix-kernel.workspace = true
arrix-sketch.workspace = true
arrix-plugin-api.workspace = true
base64.workspace = true
blake3.workspace = true
crc32fast.workspace = true
miniz_oxide.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The web session (ADR-0042): the authority on the page's main thread, the
# evaluator in a web worker, and the counters they share.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
jsonschema.workspace = true
