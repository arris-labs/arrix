[package]
name = "arrix-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "arrix-app"
path = "src/main.rs"

[dependencies]
arrix-core.workspace = true
arrix-kernel.workspace = true
arrix-sketch.workspace = true
arrix-plugin-api.workspace = true
arrix-doc.workspace = true
arrix-plugin-host.workspace = true
arrix-viewport.workspace = true
arrix-ui.workspace = true
egui.workspace = true
eframe.workspace = true
# `debug_state()` (docs/UI-RENDERING.md §Visual debugging).
serde.workspace = true
serde_json.workspace = true

# The visual scenarios and the scratch render (tests/visual/): native and
# dev-only, never in the shipped binary or the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest.workspace = true
egui-wgpu.workspace = true
image.workspace = true
pollster.workspace = true

# Looked at on demand, compared against nothing: not run by `cargo test`.
[[test]]
name = "visual_scratch"
path = "tests/visual_scratch.rs"
test = false
