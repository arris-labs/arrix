[workspace]
resolver = "3"
members = [
    "crates/arrix-core",
    "crates/arrix-kernel",
    "crates/arrix-sketch",
    "crates/arrix-plugin-api",
    "crates/arrix-doc",
    "crates/arrix-plugin-host",
    "crates/arrix-viewport",
    "crates/arrix-ui",
    "crates/arrix-config",
    "crates/arrix-app",
    "crates/arrix-cli",
]
# The first-party Rust plugins are workspaces of their own, as an out-of-tree
# plugin is (plans/c3-m3 Findings 5); the gate runs each by `--manifest-path`
# (docs/ARCHITECTURE.md §Gates).
exclude = ["plugins/gears", "plugins/robotics"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arris-labs/arrix"
# Reserving and publishing names is the human's act (SEED.md §2).
publish = false

# The kernel re-evaluates on every parameter edit and the sketch solver runs
# per frame on the UI thread, so an unoptimised dependency tree is felt in
# `cargo run`. Dependencies build at full optimisation once; our own crates
# stay at 1 so backtraces and stepping still work.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
arrix-core = { path = "crates/arrix-core" }
arrix-kernel = { path = "crates/arrix-kernel" }
arrix-sketch = { path = "crates/arrix-sketch" }
arrix-plugin-api = { path = "crates/arrix-plugin-api" }
arrix-doc = { path = "crates/arrix-doc" }
arrix-plugin-host = { path = "crates/arrix-plugin-host" }
arrix-viewport = { path = "crates/arrix-viewport" }
arrix-ui = { path = "crates/arrix-ui" }
arrix-config = { path = "crates/arrix-config" }
# First-party Tier 0 plugins, named only by the binaries' registration
# lists (docs/PLUGINS.md §Three tiers); each is a workspace of its own,
# compiled in from its path.
arrix-gears = { path = "plugins/gears" }
arrix-robotics = { path = "plugins/robotics" }

# The kernel: pinned minor, crates.io only (SEED.md §8.3). Named by
# `arrix-kernel` alone (docs/ARCHITECTURE.md §Crates and the layer rule).
arris = "0.8"

# One egui minor for the whole workspace (docs/UI-RENDERING.md).
egui = "0.36"
eframe = "0.36"
egui-wgpu = "0.36"

# Plain math in `arrix-core` (docs/ARCHITECTURE.md §Crates): f64 vectors
# with serde, no SIMD-dependent results.
glam = { version = "0.33", features = ["serde"] }
# A plugin's transcendental math, the same bits on every target
# (ADR-0036): `arrix_plugin_api::math`.
libm = "0.2"
# The viewport's vertex and uniform layouts, cast to bytes for upload.
bytemuck = { version = "1", features = ["derive"] }
# The clock the camera's animations read, which std's does not give wasm32
# (docs/CONCURRENCY-WASM.md §The browser build).
web-time = "1"
# The native save dialog (crates/arrix-app/src/file_dialog); the XDG portal
# backend, so no GTK is linked.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Exact float parsing: the file format's floats round-trip (docs/DATA-MODEL.md
# §File format), which the default parser does not promise.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# Plugin manifests (docs/PLUGINS.md §The manifest): `arrix-plugin.toml`,
# its versions and its `api` range.
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
semver = { version = "1", features = ["serde"] }
# Feature input hashes (docs/DATA-MODEL.md §Evaluation). `pure`: no C or
# assembly, so every target hashes through the same code.
# The `.arrx` zip (docs/DATA-MODEL.md §File format): a writer and reader of
# our own over pure-Rust deflate and CRC-32, so every target writes the same
# bytes and nothing needs C.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
crc32fast = "1"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
# The SHA-256 Arris's fixture recipes name a STEP file by (`arrix-kernel`'s
# fixture export of an import).
sha2 = { version = "0.10", default-features = false }

# The plugin API's equality test (docs/PLUGINS.md §One interface): the
# guest bindings generated from the WIT world, and its parser for the
# world's inventory. Dev-only; no generated code ships.
wit-bindgen = { version = "0.62", default-features = false, features = ["macros"] }
wit-parser = "0.259"
proptest = "1"
# The Tier 1 host (ADR-0035, arrix-plugin-host's `tier1`, native only): the
# component runtime, the componentiser of a core module built by
# wit-bindgen, and the reader that tells a core module from a component.
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
wit-component = "0.258"
wasmparser = "0.258"
wasm-encoder = "0.258"
# The wire spike (crates/arrix-cli/tests/wire_spike.rs, ADR-0022): the
# encodings it measures JSON against. Dev-only, run by name.
ciborium = "0.2"
base64 = "0.22"
# The wire tests' JSON Schema check (crates/arrix-plugin-host/tests/support).
regex = "1"
# The session protocol's JSON Schemas (ADR-0023 §5), derived from its
# types behind each crate's `schema` feature, and the validator the
# round-trip tests hold them to (dev-only; no fetching of remote schemas).
schemars = { version = "1.2", features = ["semver1"] }
jsonschema = { version = "0.58", default-features = false }

# The headless visual harness (docs/UI-RENDERING.md §Visual debugging):
# drives the real eframe app and renders through wgpu, preferring a CPU
# adapter so a developer's machine and CI (lavapipe) agree. Dev-only;
# `image` and `pollster` also serve `arrix-app render` (ADR-0025).
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
