[workspace]
resolver = "3"
members = [
    "crates/arrix-core",
    "crates/arrix-kernel",
    "crates/arrix-sketch",
    "crates/arrix-plugin-api",
    "crates/arrix-doc",
    "crates/arrix-plugin-host",
    "crates/arrix-viewport",
    "crates/arrix-ui",
    "crates/arrix-app",
    "crates/arrix-cli",
    "plugins/gears",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arris-labs/arrix"
# Reserving and publishing names is the human's act (SEED.md §2).
publish = false

# The kernel re-evaluates on every parameter edit and the sketch solver runs
# per frame on the UI thread, so an unoptimised dependency tree is felt in
# `cargo run`. Dependencies build at full optimisation once; our own crates
# stay at 1 so backtraces and stepping still work.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
arrix-core = { path = "crates/arrix-core" }
arrix-kernel = { path = "crates/arrix-kernel" }
arrix-sketch = { path = "crates/arrix-sketch" }
arrix-plugin-api = { path = "crates/arrix-plugin-api" }
arrix-doc = { path = "crates/arrix-doc" }
arrix-plugin-host = { path = "crates/arrix-plugin-host" }
arrix-viewport = { path = "crates/arrix-viewport" }
arrix-ui = { path = "crates/arrix-ui" }

# The kernel: pinned minor, crates.io only (SEED.md §8.3). Named by
# `arrix-kernel` alone (docs/ARCHITECTURE.md §Crates and the layer rule).
arris = "0.2"

# One egui minor for the whole workspace (docs/UI-RENDERING.md).
egui = "0.36"
eframe = "0.36"
egui-wgpu = "0.36"

# Plain math in `arrix-core` (docs/ARCHITECTURE.md §Crates): f64 vectors
# with serde, no SIMD-dependent results.
glam = { version = "0.33", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Exact float parsing: the file format's floats round-trip (docs/DATA-MODEL.md
# §File format), which the default parser does not promise.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
proptest = "1"

# The headless visual harness (docs/UI-RENDERING.md §Visual debugging):
# drives the real eframe app and renders through wgpu, preferring a CPU
# adapter so a developer's machine and CI (lavapipe) agree. Dev-only.
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
