# The gate (docs/ARCHITECTURE.md §Gates), job for job the commands of
# .githooks/pre-commit and scripts/gate (ADR-0041). scripts/gate-selftest checks
# that the two stay the same list: the steps named `gate: …` run, one line
# each, exactly the gate's commands, each once. Other steps are setup.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: "gate: rustfmt"
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins/gears -> target
            plugins/robotics -> target
      - name: "gate: clippy"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: "gate: clippy, plugins/gears"
        run: cargo clippy --manifest-path plugins/gears/Cargo.toml --all-targets --all-features -- -D warnings
      - name: "gate: clippy, plugins/robotics"
        run: cargo clippy --manifest-path plugins/robotics/Cargo.toml --all-targets --all-features -- -D warnings

  lints:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: "gate: size lint"
        run: scripts/size-lint
      - name: "gate: wasm lint"
        run: scripts/wasm-lint
      - name: "gate: layer lint"
        run: scripts/layer-lint
      - name: "gate: lint self-test"
        run: scripts/gate-selftest

  test:
    runs-on: ubuntu-24.04
    env:
      # CI has lavapipe, so a visual scenario that skips is a failure; and
      # the runner image has Chrome, so a browser test that skips is too
      # (crates/arrix-web-test).
      ARRIX_REQUIRE_GPU: "1"
      ARRIX_REQUIRE_BROWSER: "1"
      # The job fills several target directories (the workspace, each
      # plugin workspace, the tests' own Tier 1 and out-of-tree builds);
      # with full debuginfo they outgrow the runner's disk. Line tables
      # keep a panic's backtrace.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The image's Android SDK, .NET, GHC and CodeQL take tens of GB the
      # job never uses; without them the runner ran out of disk mid-test.
      - name: free the runner's disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: lavapipe, the reference adapter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins/gears -> target
            plugins/robotics -> target
      - name: cargo-nextest, pinned (ADR-0040)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144
      - name: install wasm-bindgen-cli, for the browser tests' pages
        run: cargo install wasm-bindgen-cli --version '=0.2.129' --locked
      - name: "gate: tests"
        run: cargo nextest run --workspace
      - name: "gate: tests, all features"
        run: cargo nextest run --workspace --all-features
      - name: "gate: doctests"
        run: cargo test --workspace --doc
      - name: "gate: tests, plugins/gears"
        run: cargo nextest run --manifest-path plugins/gears/Cargo.toml
      - name: "gate: doctests, plugins/gears"
        run: cargo test --doc --manifest-path plugins/gears/Cargo.toml
      - name: "gate: tests, plugins/robotics"
        run: cargo nextest run --manifest-path plugins/robotics/Cargo.toml
      - name: "gate: doctests, plugins/robotics"
        run: cargo test --doc --manifest-path plugins/robotics/Cargo.toml
      # Before, after and diff images against the parent: on a push the
      # previous commit, on a pull request the base branch.
      - name: baseline images of a failed scenario
        if: failure()
        run: scripts/snapshot-baseline HEAD~1
      - name: upload the frames of a failed scenario
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: target/snapshots/
          if-no-files-found: ignore

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins/gears -> target
            plugins/robotics -> target
      - name: "gate: wasm32 build"
        run: cargo build --target wasm32-unknown-unknown --workspace --exclude arrix-cli --exclude arrix-plugin-test --exclude arrix-web-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version '=0.2.129' --locked
      - name: "gate: web build"
        run: scripts/web-build
      - name: "gate: wasm32 tests"
        run: cargo test --target wasm32-unknown-unknown -p arrix-plugin-host --test wasm_determinism
      - name: "gate: guest build, plugins/gears"
        run: cargo build --release --target wasm32-unknown-unknown --features guest --manifest-path plugins/gears/Cargo.toml --target-dir plugins/gears/target/guest
      - name: "gate: guest build, plugins/robotics"
        run: cargo build --release --target wasm32-unknown-unknown --features guest --manifest-path plugins/robotics/Cargo.toml --target-dir plugins/robotics/target/guest
